name: CI

# No path filtering, deliberately. Both filtering mechanisms are incompatible
# with required status checks: `paths-ignore` prevents the run entirely, so a
# required context is never reported and the PR blocks forever; a job-level
# `if:` gate reports "skipped", which never satisfies a required context. See
# dev/REPO-STANDARDS.md STD-CI-7. Filtering `**/*.md` would also skip the
# standards check, which reads this repository's Markdown.
#
# Every `uses:` in this repository pins a commit SHA with the release it belongs
# to in a trailing comment, per STD-CI-8. A major tag such as `@v5` is mutable:
# whoever controls the action repository can retarget it, and the next run
# executes different code with no diff here. The comment is what dependabot
# reads to offer an upgrade, so it must stay accurate when a SHA changes.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

# See dev/REPO-STANDARDS.md STD-CI-6. Keyed on the ref, so a force-push to a PR
# branch cancels the superseded run instead of leaving a 3-node matrix plus the
# other job racing the new one. `github.workflow` is in the group because a
# bare ref would collide with the other ref-keyed workflows on this repository.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never on main: every push to main must leave a completed status behind, and
  # the branch-protection contexts are reported from this workflow.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['22', '24', '25']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before setup-node, which needs pnpm on PATH to resolve its cache key.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This repository is a single package, so its root `check` is the whole
      # check set: standards, build, typecheck, lint, format, tests and unused
      # dependencies. Nothing here delegates to `pnpm -r`, which would exclude
      # the workspace root and skip every one of them.
      - name: Run checks
        run: pnpm run check

  standards:
    name: Repository standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A copy nobody checks rots quietly. dev/ is a plain copy of rcrsr/rill
      # dev/, so this fails the build when it drifts from the source or when
      # the source drops a file this repository still holds. Raw git rather
      # than actions/checkout: a shallow public clone needs no action, and so
      # no STD-CI-8 pin to keep accurate.
      - name: Check dev assets are current
        run: |
          git clone --depth 1 https://github.com/rcrsr/rill ../rill
          ../rill/dev/apply.sh --check .

      # Before setup-node, which needs pnpm on PATH to resolve its cache key.
      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --remote adds the branch-protection and repository-settings elements,
      # which are host state and cannot be read from a checkout. GITHUB_TOKEN
      # covers the read-only API calls it makes.
      - name: Check repository standards conformance
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash dev/check-standards.sh --remote
